services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local-postgres-password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/schema.sql:/opt/loan-engine/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-loan-user-uploads}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-loan-upload-events}
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://loan_app:local-app-password@postgres:5432/loan_engine
      S3_BUCKET: ${S3_BUCKET:-loan-user-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_INTERNAL_ENDPOINT_URL: ${S3_INTERNAL_ENDPOINT_URL:-http://localstack:4566}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:4566}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-loan-upload-events}
      PRESIGNED_URL_EXPIRY_SECONDS: ${PRESIGNED_URL_EXPIRY_SECONDS:-900}
      N8N_MATCH_WEBHOOK_URL: ${N8N_MATCH_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-replace-before-enabling-workflow-b}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.worker"]
    environment:
      DATABASE_URL: postgresql://loan_app:local-app-password@postgres:5432/loan_engine
      S3_BUCKET: ${S3_BUCKET:-loan-user-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_INTERNAL_ENDPOINT_URL: ${S3_INTERNAL_ENDPOINT_URL:-http://localstack:4566}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:4566}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-loan-upload-events}
      N8N_MATCH_WEBHOOK_URL: ${N8N_MATCH_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-replace-before-enabling-workflow-b}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.43.6
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: local-n8n-password
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-a-long-random-local-key}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
  n8n_data:

